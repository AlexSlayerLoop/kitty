# Theme
include "Solarized Osaka.conf"

mouse_hide_wait -1
# shell zsh -l

# Font
font_size 22.0
font_family      family="JetBrainsMono Nerd Font Mono"

# Cursor
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Windows
hide_window_decorations titlebar-only
# window_title_template "{session_name}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{title}"

# Tabs
tab_bar_style fade
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_align center
tab_bar_filter session:~ or session:^$

# Macos
macos_option_as_alt yes
macos_traditional_fullscreen yes

# Scrollback
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Mappings
map ctrl+alt+enter launch --cwd=current
map ctrl+alt+t launch --cwd=current --type=tab
map ctrl+shift+q focus_visible_window

map kitty_mod+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd
map kitty_mod+n new_os_window_with_cwd

# Sessions
startup_session ~/.local/share/kitty/sessions/home.kitty-session

map ctrl+8>t goto_session ~/.local/share/kitty/sessions/tequila.kitty-session

map ctrl+8>h goto_session ~/.local/share/kitty/sessions/home.kitty-session
map ctrl+8>c goto_session ~/.local/share/kitty/sessions/config.kitty-session
map ctrl+8>l goto_session ~/.local/share/kitty/sessions/leetcode.kitty-session
map ctrl+8>n goto_session ~/.local/share/kitty/sessions/notes.kitty-session
map ctrl+8>- goto_session -1


map ctrl+, goto_session --sort-by=alphabetical
